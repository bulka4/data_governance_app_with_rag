kafka:
  global:
    security:
      allowInsecureImages: true

  controller:
    replicaCount: 1

  # Add this when controller.replicaCount = 1 to enable creating the __consumer_offsets topic which is needed
  # for consumers to be able to read messages.
  overrideConfiguration:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1

  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 4.0.0-debian-12-r10

  listeners:
    client:
      protocol: PLAINTEXT