apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingestion
  namespace: semantic-search
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ingestion
  
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ingestion
    
    spec:
      containers:
        - name: ingestion
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Run the script for ingesting embeddings
          # command: ["python", {{ .Values.appPath }}]
          # command: ["sleep", "3600"]
          command: ["bash", "-c"]
          args:
          - |
            # Use the -u option to see outputs in pod's terminal
            python -u {{ .Values.appPath }}

          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          volumeMounts:
            - name: ingestion-data
              mountPath: /app
              subPath: {{ .Values.scriptsMounting.subPath }}

      volumes:
        - name: ingestion-data
          hostPath:
            path: {{ .Values.scriptsMounting.hostPath }}