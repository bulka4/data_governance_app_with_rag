namespace: semantic-search

# Parameters for the RayService resource
rayService:
  name: rag-rayservice  # Name of the created RayService resource
  replicas: 1
  rayVersion: "2.49.1"  # match the Ray version of KubeRay
  headCpu: "2"
  headMemory: "3Gi"
  workerCpu: "2"
  workerMemory: "3Gi"

# Name of the image to use to run the Ray Serve app
image: semantic-search


# Parameters related to the Ray Serve app
app:
  # workingDir - Path to the .zip folder containing all the files needed for the Ray app (this is a path inside the container where we use mounting)
  # fileName - Name of the file with the Ray Serve app (without the .py extension)
  # folderPath - A full path to the folder containing the Ray Serve app in the image
  # boundDeploymentName - Name of the bound deployment - output of the APIClassName.bind() command, where APIClassName is name of the 
  #                       class where we define Rest API endpoints
  workingDir: /app/routes.zip
  fileName: routes
  boundDeploymentName: rag_service


# Environment variables used by the app
env:
  # URL of the MCP server to use for semantic search
  MCP_SERVER_URL: http://mcp:8000/mcp/
  # Name of the MCP tool for semantic search to use
  SEMANTIC_SEARCH_TOOL: search_docs

  # - download_model
  #     - When set to "False", it will load already saved ONNX model
  #     - When set to "True", it will download a new model from Hugging Face if it doesn't exist yet and save it in the ONNX format 
  #         using optimum-cli
  # - model_name, model_path
  #     - when download_model = True, then we need to provide both arguments:
  #         - model_name - Name of the model to download using optimum-cli, e.g. sentence-transformers/all-MiniLM-L6-v2
  #         - model_path - Where to save the downloaded model
  #     - when download_model = False, then we need to provide only the model_path argument specifying the path of the
  #         ONNX model to load
  
  # Parameters for the model for generating embeddings (download_model, model_name, model_path)
  DOWNLOAD_EMBEDDING_MODEL: "False"
  EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
  EMBEDDING_MODEL_PATH: /app/ml_models/embeddings/all-MiniLM-L6-v2

  # Parameters for the model for generating answers (download_model, model_name, model_path)
  DOWNLOAD_ANSWER_MODEL: "False"
  ANSWER_MODEL_NAME: sshleifer/tiny-gpt2
  ANSWER_MODEL_PATH: /app/ml_models/answer/tiny-gpt2
  
  # ====================================================================================================
  # Variables related to Milvus, the same as in the 'create_milvus_collection' Helm chart, values.yaml file
  # ====================================================================================================
  
  # IP address or DNS name of the Milvus db where we store documents used for semantic search.
  MILVUS_HOST: milvus
  # Name of the collection in the Milvus db with documents used for semantic search.
  MILVUS_COLLECTION_NAME: my_docs
  # Name of the field in the milvus collection which holds vector embeddings.
  EMBEDDING_FIELD_NAME: embedding
  # Name of the field in the milvus collection which holds metadata
  METADATA_FIELD_NAME: metadata
  # Name of the field in the milvus collection which holds a text chunk
  TEXT_FIELD_NAME: text
  # Name of the field in metadata in the milvus collection which represents an ID of the object which documentation refers to
  OBJECT_ID_FIELD_NAME: object_id

# Parameters regarding mounting Azure File share containing scripts to run in pods.
scriptsMounting:
  enabled: true
  # Path to the folder on the host (kind node) which will be used as a volume. 
  # The same path needs to be provided in the kind-config.yaml file in the nodes[0].extraMounts.containerPath field to 
  # specify which path on the host (which runs kind) will correspond to this path.
  # This path should contain the 'services' folder from the repo on the host.
  hostPath: /services
  # Path to a subfolder in volume with FastAPI routes to run which will be mounted into the /app folder
  subPath: semantic_search